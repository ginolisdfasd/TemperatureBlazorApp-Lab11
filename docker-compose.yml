services:
  db:
    image: postgres:16
    container_name: postgres-db
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: backend-app
    ports:
      - "8080:8080"
    environment:
      DB_CONNECTION: "Host=db;Port=5432;Database=appdb;Username=postgres;Password=postgres"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
