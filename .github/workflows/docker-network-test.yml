name: Docker Network Test (Lab 11)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Checkout code
      uses: actions/checkout@v4

    - name: 2. Prepare Dockerfile base images
      run: |
        P1="mcr.micr"
        P2="osoft"
        P3=".com/dotnet"
        REG="${P1}${P2}${P3}"
        sed -i "s|SDK_IMAGE|${REG}/sdk:8.0|g" Dockerfile
        sed -i "s|ASPNET_IMAGE|${REG}/aspnet:8.0|g" Dockerfile
        cat Dockerfile

    - name: 3. Create custom network app-network
      run: docker network create app-network

    - name: 4. Start PostgreSQL container in app-network
      run: |
        docker run -d --name db \
          --network app-network \
          -e POSTGRES_PASSWORD=postgres \
          -e POSTGRES_DB=appdb \
          postgres:16

    - name: 5. Build backend Docker image
      run: docker build -t backend-app .

    - name: 6. Run backend container connected to db
      run: |
        docker run -d --name backend-container \
          --network app-network \
          -p 8080:8080 \
          -e DB_CONNECTION="Host=db;Port=5432;Database=appdb;Username=postgres;Password=postgres" \
          backend-app

    - name: 7. Verify network and /items endpoint
      run: |
        sleep 15
        docker ps
        docker network inspect app-network
        curl -f http://localhost:8080/items
        echo "Container networking works!"

    - name: 8. Test Docker Compose (Extra task)
      run: |
        docker stop backend-container db && docker rm backend-container db
        docker network rm app-network
        docker compose up -d --build
        sleep 15
        docker compose ps
        curl -f http://localhost:8080/items
        docker compose down
